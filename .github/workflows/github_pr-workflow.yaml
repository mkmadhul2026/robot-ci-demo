on:
  push:
    branches:
      - feature/br1

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to check'
        required: true
        type: choice
        default: 'TC_robot-ci-demo'
        options:
          - 'TC_robot-ci-demo'
          - 'TC_robotfw-learning'

      project_code:
        description: 'Project code to check'
        required: true
        type: choice
        default: 'PC_robot-ci-demo'
        options:
          - 'PC_robot-ci-demo'
          - 'PC_robotfw-learning'

jobs:
  pr-check-info:
    runs-on: self-hosted

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check inputs
        run: |
          Write-Host "project_code='${{ github.event.inputs.project_code }}'"
          Write-Host "tag='${{ github.event.inputs.tag }}'"

          if ("${{ github.event.inputs.project_code }}" -eq "PC_robot-ci-demo") {
              Write-Host "Robot CI Demo selected"
          }
          elseif ("${{ github.event.inputs.project_code }}" -eq "PC_robotfw-learning") {
              Write-Host "Robot FW Learning selected"
          }