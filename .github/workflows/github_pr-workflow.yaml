name: PR check Info

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  all-tests:

    runs-on: [self-hosted]

    steps:

        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Check PR info
          run: |
            echo "PR number: ${{ github.event.pull_request.number }}"
            echo "PR title: ${{ github.event.pull_request.title }}"
            echo "PR body: ${{ github.event.pull_request.body }}"    

            