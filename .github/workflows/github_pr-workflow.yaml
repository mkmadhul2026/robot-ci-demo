on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to check'
        required: true
        type: choice
        default: 'TC_robot-ci-demo'
        options:
          - 'TC_robot-ci-demo'
          - 'TC_robotfw-learning'

      project_code:
        description: 'Project code to check'
        required: true
        type: choice
        default: 'PC_robot-ci-demo'
        options:
          - 'PC_robot-ci-demo'
          - 'PC_robotfw-learning'

jobs:
  pr-check-info:
    runs-on: self-hosted

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check PR info
        run: |
          if [[ "${{ inputs.project_code }}" == "PC_robot-ci-demo" ]]; then
            echo "tag=${{ inputs.tag }} project_code=${{ inputs.project_code }}"
          elif [[ "${{ inputs.project_code }}" == "PC_robotfw-learning" ]]; then
            echo "tag=${{ inputs.tag }} project_code=${{ inputs.project_code }}"
          fi