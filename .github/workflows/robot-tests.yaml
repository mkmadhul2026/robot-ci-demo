name: Robot Framework Tests screenshot Robot CI Demo

on:
  push:
    branches:
      - screenshot-branch

  workflow_dispatch:
    inputs:
      screenshot:
        description: 'Screenshot required for Robot Framework tests'
        required: false
        type: choice
        options:
          - true
          - false
        default: true

jobs:
  robot-tests:

    runs-on: [self-hosted]

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run Robot tests
        run: |
          python -m robot --outputdir results --variable SCREENSHOT:${{ inputs.screenshot || 'false' }} tests/

      - name: Upload Robot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results/

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-screenshots
          path: results/**/*.png
          if-no-files-found: ignore
